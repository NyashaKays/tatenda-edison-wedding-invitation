<style>
:root{--bg:#F6F1E4;--card:#FFFDF7;--ink:#1C1B18;--muted:#6E6A5E;--gold:#A8842F;--line:#E4DAC2;--warn:#9A5B12}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif;padding:36px max(16px,4vw)}
main{max-width:900px;margin:0 auto}
h1{font-weight:400;margin:0 0 4px;font-size:32px} .sub{color:var(--muted);margin:0 0 22px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px}
.bar label{display:grid;gap:4px;font:12px system-ui,sans-serif;color:var(--muted);flex:1 1 240px}
input{font:15px system-ui,sans-serif;padding:9px 12px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff;color:var(--ink)}
ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
li{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
li div{min-width:0;flex:1 1 300px} b{font-weight:600} .no{color:var(--muted);font:12px system-ui,sans-serif;margin-right:6px}
.tag{white-space:nowrap;display:inline-block;font:11px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.vip{background:#1C1B18;color:#E9CF8E} .sent-tag{background:#DCEBDD;color:#1F5E3B}
.yes-tag{background:#F1E3BC;color:#6B4E12} .no-tag{background:#ECE6DA;color:#6E6A5E}
.replies{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:-6px 0 18px;font:14px system-ui,sans-serif}
.replies b{font:600 20px Georgia,serif;margin-right:4px} .replies button{margin-left:auto}
li.sent{opacity:.62} .seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:transparent;color:var(--ink);border-color:var(--line)} .seg button[aria-pressed="true"]{background:var(--ink);color:#F4E3B5;border-color:var(--ink)}
button.mark{background:transparent;color:var(--ink);border-color:var(--line)}
@media (max-width:560px){ .acts{width:100%} .acts>*{flex:1;text-align:center;padding:11px 10px} h1{font-size:26px} }
code{display:block;font-size:12.5px;color:var(--muted);word-break:break-all}
.acts{display:flex;gap:8px}
button,a.wa{font:13px system-ui,sans-serif;padding:8px 14px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#F4E3B5;text-decoration:none;cursor:pointer;white-space:nowrap}
a.wa{background:#1F7A4D;border-color:#1F7A4D;color:#fff}
button:focus-visible,a.wa:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.empty{color:var(--muted);padding:20px 0}

const rsvpUrl = () => base() + "/api/rsvp";

const onSite = /^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname);

function base() { return onSite ? location.origin : ($("site").value.trim() || "https://tatenda-edison-wedding-invitation.vercel.app").replace(/\/+$/, ""); }

function saveSent() { try { localStorage.setItem("sent", JSON.stringify(sent)); } catch {} }
let filter = "todo";
function message(g, link) {
  return `Dear ${g.name},\n\nWith hearts full of love, the Murenje and Mugobo families invite you to the wedding of Tatenda and Nyasha on Friday, 25 December 2026 at Zimbali Gardens, Greendale.\n\nYour personal invitation: ${link}\n\nOnly persons named on this invitation will be admitted.Kindly submit RSVP details so that we know you will be joining us Thank You 😊`;
}
function render() {
  const q = $("q").value.trim().toLowerCase();
  const n = GUESTS.filter(g => sent[g.code]).length;
  $("progress").textContent = `${n} of ${GUESTS.length} sent on this device`;
  const r = g => (rsvp[g.code] || {}).response || "";
  {
    const yes = GUESTS.filter(g => r(g) === "Attending").length, no = GUESTS.filter(g => r(g) === "Not attending").length;
    $("nYes").textContent = yes; $("nNo").textContent = no; $("nWait").textContent = GUESTS.length - yes - no;
  }
  const keep = g => filter === "all" ? true : filter === "yes" ? r(g) === "Attending" : filter === "no" ? r(g) === "Not attending" : (filter === "sent") === !!sent[g.code];
  const shown = GUESTS.filter(g => (!q || g.name.toLowerCase().includes(q)) && keep(g));

document.addEventListener("click", e => {
  const f = e.target.closest("[data-f]");

  const t = e.target.closest("[data-toggle]");
